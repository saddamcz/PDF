<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>PDF</title>
  <style>
    :root {
      color-scheme: light;
      background: #fff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    body {
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    #viewer {
      display: flex;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #fff;
      scroll-behavior: smooth;
      scroll-snap-stop: always;
      scrollbar-width: none;
      overscroll-behavior: none;
      touch-action: none;
    }

    #viewer::-webkit-scrollbar { display: none; }

    #viewer.vertical {
      flex-direction: column;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
    }

    #viewer.horizontal {
      flex-direction: row;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
    }

    .page {
      display: flex;
      flex: 0 0 100%;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
      line-height: 0;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    #viewer.horizontal .page {
      width: 100%;
      min-width: 100%;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff;
      color: #333;
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      z-index: 10;
    }

    #status[hidden] { display: none; }

    #status.error {
      color: #7d1b1b;
    }

    .error-box {
      max-width: 680px;
    }

    .error-box code {
      overflow-wrap: anywhere;
      font-size: .9em;
    }
  </style>
</head>
<body>
  <main id="viewer" aria-label="Publikace"></main>
  <div id="status">Načítám publikaci…</div>

  <!-- PDF.js je použito pouze jako vykreslovací knihovna; vlastní toolbar se nepoužívá. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Lze změnit napevno, nebo předat URL parametrem ?pdf=...
    const DEFAULT_PDF_URL =
      "https://lfp.cuni.cz/wp-content/uploads/2024/05/safety-training.pdf";

    const params = new URLSearchParams(window.location.search);
    const pdfUrl = params.get("pdf") || DEFAULT_PDF_URL;
    // Výchozí režim je vertikální. Alternativa: ?direction=horizontal
    const pageDirection = params.get("direction") === "horizontal"
      ? "horizontal"
      : "vertical";
    const viewer = document.getElementById("viewer");
    const status = document.getElementById("status");
    let pdfDocument = null;
    let renderToken = 0;
    let currentPage = 0;
    let gestureStartX = 0;
    let gestureStartY = 0;
    let gestureActive = false;
    let wheelLocked = false;

    viewer.classList.add(pageDirection);

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    function showError(message) {
      status.className = "error";
      status.innerHTML =
        '<div class="error-box"><strong>Publikaci se nepodařilo načíst.</strong><br><br>' +
        message +
        "</div>";
    }

    function escapeHtml(value) {
      return value.replace(/[&<>\"]/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;"
      })[character]);
    }

    async function renderPage(page, pageContainer, token) {
      if (token !== renderToken) return;

      const baseViewport = page.getViewport({ scale: 1 });
      const targetWidth = Math.max(1, viewer.clientWidth);
      const targetHeight = Math.max(1, viewer.clientHeight);
      const cssScale = Math.min(
        targetWidth / baseViewport.width,
        targetHeight / baseViewport.height
      );
      const viewport = page.getViewport({ scale: cssScale });
      const outputScale = Math.min(window.devicePixelRatio || 1, 2);

      pageContainer.style.width = `${targetWidth}px`;
      pageContainer.style.height = `${targetHeight}px`;
      pageContainer.style.minWidth = `${targetWidth}px`;
      pageContainer.style.minHeight = `${targetHeight}px`;

      const canvas = pageContainer.querySelector("canvas") || document.createElement("canvas");
      const context = canvas.getContext("2d", { alpha: false });

      canvas.width = Math.ceil(viewport.width * outputScale);
      canvas.height = Math.ceil(viewport.height * outputScale);
      canvas.style.width = `${Math.ceil(viewport.width)}px`;
      canvas.style.height = `${Math.ceil(viewport.height)}px`;

      if (!canvas.parentNode) pageContainer.appendChild(canvas);

      await page.render({
        canvasContext: context,
        viewport,
        transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null
      }).promise;
    }

    async function renderAllPages() {
      if (!pdfDocument) return;
      const token = ++renderToken;
      const pages = Array.from(viewer.querySelectorAll(".page"));

      for (let index = 0; index < pages.length; index += 1) {
        const page = await pdfDocument.getPage(index + 1);
        await renderPage(page, pages[index], token);
      }

      goToPage(currentPage, false);
    }

    function goToPage(pageIndex, smooth = true) {
      if (!pdfDocument) return;
      currentPage = Math.max(0, Math.min(pageIndex, pdfDocument.numPages - 1));
      const position = pageDirection === "horizontal"
        ? { left: currentPage * viewer.clientWidth, top: 0 }
        : { left: 0, top: currentPage * viewer.clientHeight };

      viewer.scrollTo({
        ...position,
        behavior: smooth ? "smooth" : "auto"
      });
    }

    function changePage(step) {
      goToPage(currentPage + step);
    }

    function handleSwipe(endX, endY) {
      const deltaX = endX - gestureStartX;
      const deltaY = endY - gestureStartY;
      const primaryDelta = pageDirection === "horizontal" ? deltaX : deltaY;
      const secondaryDelta = pageDirection === "horizontal" ? deltaY : deltaX;

      if (Math.abs(primaryDelta) < 45 || Math.abs(primaryDelta) < Math.abs(secondaryDelta)) {
        return;
      }

      // Swipe up/left = next page; swipe down/right = previous page.
      changePage(primaryDelta < 0 ? 1 : -1);
    }

    async function loadPdf() {
      try {
        pdfDocument = await pdfjsLib.getDocument({
          url: pdfUrl,
          withCredentials: false
        }).promise;

        const fragment = document.createDocumentFragment();
        for (let index = 0; index < pdfDocument.numPages; index += 1) {
          const page = document.createElement("section");
          page.className = "page";
          page.setAttribute("aria-label", `Strana ${index + 1}`);
          fragment.appendChild(page);
        }
        viewer.appendChild(fragment);
        status.hidden = true;
        await renderAllPages();
      } catch (error) {
        console.error(error);
        showError(
          "Tato stránka musí být hostovaná na stejném webu jako PDF, nebo musí server PDF povolit načítání z jiné domény (CORS).<br><br>" +
          "Aktuální PDF URL:<br><code>" + escapeHtml(pdfUrl) + "</code>"
        );
      }
    }

    viewer.addEventListener("touchstart", event => {
      if (event.touches.length !== 1) return;
      gestureActive = true;
      gestureStartX = event.touches[0].clientX;
      gestureStartY = event.touches[0].clientY;
    }, { passive: true });

    viewer.addEventListener("touchend", event => {
      if (!gestureActive || event.changedTouches.length !== 1) return;
      gestureActive = false;
      const touch = event.changedTouches[0];
      handleSwipe(touch.clientX, touch.clientY);
    }, { passive: true });

    viewer.addEventListener("wheel", event => {
      event.preventDefault();
      if (wheelLocked) return;
      const delta = pageDirection === "horizontal" ? event.deltaX || event.deltaY : event.deltaY || event.deltaX;
      if (Math.abs(delta) < 2) return;
      wheelLocked = true;
      changePage(delta > 0 ? 1 : -1);
      window.setTimeout(() => { wheelLocked = false; }, 550);
    }, { passive: false });

    window.addEventListener("keydown", event => {
      const nextKey = pageDirection === "horizontal" ? "ArrowRight" : "ArrowDown";
      const previousKey = pageDirection === "horizontal" ? "ArrowLeft" : "ArrowUp";

      if (event.key === nextKey || event.key === "PageDown") {
        event.preventDefault();
        changePage(1);
      } else if (event.key === previousKey || event.key === "PageUp") {
        event.preventDefault();
        changePage(-1);
      } else if (event.key === "Home") {
        event.preventDefault();
        goToPage(0);
      } else if (event.key === "End") {
        event.preventDefault();
        goToPage(pdfDocument ? pdfDocument.numPages - 1 : 0);
      }
    });

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderAllPages(), 150);
    });

    loadPdf();
  </script>
</body>
</html>
